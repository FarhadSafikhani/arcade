<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#060e12">
    <meta name="description" content="A little arcade of things to play. Build with Snapforge, create with Stickers, and discover a few more experiments.">
    <title>Vibe Arcade</title>
    <link rel="icon" type="image/svg+xml" href="/assets/brand/arcade.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/styles/landing.css">
</head>
<body>
    <div class="alley" aria-hidden="true">
        <picture class="alley-picture">
            <source media="(max-aspect-ratio: 2/3)" srcset="/assets/landing/alley-phone.webp">
            <source media="(max-aspect-ratio: 1/1)" srcset="/assets/landing/alley-mobile.webp">
            <img id="alleyImage" class="alley-image" src="/assets/landing/alley-desktop.webp" alt="" fetchpriority="high" decoding="async">
        </picture>
        <canvas id="alleyWeather" class="alley-weather"></canvas>
        <div class="alley-vignette"></div>
    </div>
    <main id="mainMenu">
        <header class="arcade-header"><h1>VIBE ARCADE</h1></header>
        <section class="shelf" aria-label="Games">
            <div id="featuredGrid" class="featured-grid"></div>
        </section>
        <details class="misc-shelf">
            <summary class="glass-button">Misc / Games</summary>
            <div id="legacyGrid" class="legacy-grid" aria-label="Experimental games"></div>
        </details>
        <noscript><p class="no-script">Enable JavaScript to explore the arcade.</p></noscript>
    </main>
    <footer class="site-footer" aria-label="Site information">
        <span class="copyright">© <span id="copyright-year">2026</span> Farhad Safikhani</span>
        <nav class="footer-socials" aria-label="Social links">
            <a href="https://www.linkedin.com/in/farhadsafikhani/" target="_blank" rel="noopener noreferrer" aria-label="Farhad Safikhani on LinkedIn">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M5.4 7.8H1.1V22h4.3V7.8ZM3.3 1A2.5 2.5 0 1 0 3.3 6a2.5 2.5 0 0 0 0-5ZM22.9 13.9c0-4.2-2.2-6.2-5.1-6.2a4.4 4.4 0 0 0-4 2.2V7.8H9.5V22h4.3v-7.1c0-1.9.4-3.7 2.7-3.7s2.2 2.1 2.2 3.8v7h4.3l-.1-8.1Z"/></svg>
            </a>
            <a href="https://x.com/Farhad0000X" target="_blank" rel="noopener noreferrer" aria-label="Farhad Safikhani on X">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.744l7.727-8.835L1.254 2.25H8.08l4.253 5.622L18.244 2.25zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
            </a>
        </nav>
    </footer>
    <span id="version-number" class="footer-version" aria-label="Site version"></span>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
