<head>
    <meta charset="UTF-8">

    <link rel="icon" type="image/svg+xml" href="/arcade/assets/brand/stickers.svg">
  <script type="module" crossorigin src="/arcade/assets/stickers-CdsKwusz.js"></script>
  <link rel="modulepreload" crossorigin href="/arcade/assets/modulepreload-polyfill-YP0FEG5d.js">
  <link rel="modulepreload" crossorigin href="/arcade/assets/index-657jbpiU.js">
  <link rel="modulepreload" crossorigin href="/arcade/assets/version-C1U1EhUU.js">
  <link rel="modulepreload" crossorigin href="/arcade/assets/Filter-D4Y2sTKO.js">
  <link rel="modulepreload" crossorigin href="/arcade/assets/defaultFilter.vert-DGu-xGx8.js">
  <link rel="modulepreload" crossorigin href="/arcade/assets/CanvasPool-CCcK9HqU.js">
  <link rel="modulepreload" crossorigin href="/arcade/assets/canvasUtils-ioCRXHKs.js">
  <link rel="modulepreload" crossorigin href="/arcade/assets/BatchableSprite-plyPVouV.js">
  <link rel="modulepreload" crossorigin href="/arcade/assets/getPo2TextureFromSource-6maLk8xR.js">
  <link rel="modulepreload" crossorigin href="/arcade/assets/Text-CQtdLZ0j.js">
  <link rel="modulepreload" crossorigin href="/arcade/assets/RenderTexture-DtSBaMf3.js">

</head>
<body class="game-page">
    <header class="stickers-header">
        <button id="backButton" class="back-link" type="button" aria-label="Back to arcade">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>
            <span id="backLabel">Arcade</span>
        </button>
        <div class="header-title"><img src="/arcade/assets/brand/stickers.svg" alt=""> Stickers</div>
    </header>
    <section id="stickerStorybook" class="story-shell boot-loading" aria-label="Painted sticker book" aria-busy="true">
        <div class="story-book">
            <div class="story-pages" inert></div>
            <div class="story-cover" aria-hidden="true">
                <div class="cover-border"></div>
                <svg class="cover-corner corner-top" viewBox="0 0 100 100" fill="none"><path d="M8 90V8h82M18 75V18h57M8 55C40 55 55 40 55 8M18 45c15 0 27-12 27-27M25 25l9 3-6 6z"/></svg>
                <svg class="cover-corner corner-bottom" viewBox="0 0 100 100" fill="none"><path d="M8 90V8h82M18 75V18h57M8 55C40 55 55 40 55 8M18 45c15 0 27-12 27-27M25 25l9 3-6 6z"/></svg>
                <span class="cover-title">The Sticker Book</span>
                <span class="cover-subtitle">A little world of wonders</span>
                <div class="book-magic">
                    <svg class="magic-orbit orbit-outer" viewBox="0 0 160 160" fill="none"><circle cx="80" cy="80" r="70"/><path d="M80 4l5 6-5 6-5-6zm76 76-6 5-6-5 6-5zM80 156l-5-6 5-6 5 6zM4 80l6-5 6 5-6 5zM30 30l8 1-7 7zm100 0-1 8-7-7zM130 130l-8-1 7-7zM30 130l1-8 7 7z"/><path d="M53 15c-24 10-38 30-38 53m92 77c24-10 38-30 38-53"/></svg>
                    <svg class="magic-orbit orbit-inner" viewBox="0 0 160 160" fill="none"><circle cx="80" cy="80" r="54" stroke-dasharray="2 9"/><path d="M80 27c8 15 20 27 53 53-33 26-45 38-53 53-8-15-20-27-53-53 33-26 45-38 53-53z"/></svg>
                    <svg class="magic-star" viewBox="0 0 80 80" fill="none"><path d="M40 7l8 25 25 8-25 8-8 25-8-25-25-8 25-8z"/><path d="M40 22l5 13 13 5-13 5-5 13-5-13-13-5 13-5z"/></svg>
                    <span class="magic-spark spark-one">✦</span><span class="magic-spark spark-two">✧</span><span class="magic-spark spark-three">✧</span>
                </div>
                <span class="cover-footer">✧ &nbsp; Every page holds a story &nbsp; ✧</span>
            </div>
        </div>
        <div class="book-boot-status" role="status" aria-live="polite">
            <p>Gathering a little magic…</p>
            <button class="book-boot-retry" type="button" hidden>Try again</button>
        </div>
    </section>
    

    
    <div id="gameContainer">
        <!-- PixiJS will create and append the canvas here -->
    </div>
    <div id="stickerLoading" class="sticker-loading" role="status" aria-live="polite" hidden>
        <div class="sticker-loading-card">
            <span class="sticker-spinner" aria-hidden="true"></span>
            <strong>Getting your sticker ready</strong>
            <span>A little puzzle magic…</span>
        </div>
    </div>

    <!-- Level Selection Menu -->
    <div id="levelMenu" class="level-menu hidden">
        <div class="level-menu-header">
            <h2>Select a Puzzle</h2>
            <p id="levelError" role="alert" hidden>That sticker couldn't load. Please try again.</p>
        </div>
        <div class="level-grid-container">
            <div id="levelGrid" class="level-grid">
                <!-- Levels will be populated by JavaScript -->
            </div>
        </div>
    </div>

    <!-- Return Button -->
    <button id="returnButton" class="return-button hidden">
        Return to Menu
    </button>
    
    
</body>
</html>
