<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Stickers Game - Arcade Collection</title>
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%assets/brand/stickers.svg">
    <link rel="stylesheet" href="/src/styles/main.css">
    <link rel="stylesheet" href="/src/styles/stickers.css">
</head>
<body class="game-page">
    <header class="stickers-header">
        <button id="backButton" class="back-link" type="button" aria-label="Back to arcade">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>
            <span id="backLabel">Arcade</span>
        </button>
        <div class="header-title"><img src="/assets/brand/stickers.svg" alt=""> Stickers</div>
    </header>
    

    
    <div id="gameContainer">
        <!-- PixiJS will create and append the canvas here -->
    </div>
    <div id="stickerLoading" class="sticker-loading" role="status" aria-live="polite" hidden>
        <div class="sticker-loading-card">
            <span class="sticker-spinner" aria-hidden="true"></span>
            <strong>Getting your sticker ready</strong>
            <span>A little puzzle magic…</span>
        </div>
    </div>

    <!-- Level Selection Menu -->
    <div id="levelMenu" class="level-menu hidden">
        <div class="level-menu-header">
            <h2>Select a Puzzle</h2>
            <p id="levelError" role="alert" hidden>That sticker couldn't load. Please try again.</p>
        </div>
        <div class="level-grid-container">
            <div id="levelGrid" class="level-grid">
                <!-- Levels will be populated by JavaScript -->
            </div>
        </div>
    </div>

    <!-- Return Button -->
    <button id="returnButton" class="return-button hidden">
        Return to Menu
    </button>
    
    
    <script type="module" src="/src/games/stickers/game.ts"></script>
</body>
</html>
